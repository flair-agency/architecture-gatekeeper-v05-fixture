name: Architecture Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  architecture-gate:
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
    uses: flair-agency/architecture-gatekeeper/.github/workflows/architecture-gate.yml@e0c0556aff22240326c3dc8b6615a6bdc5031d60
    with:
      protected-review-instructions: true
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
