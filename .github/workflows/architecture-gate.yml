name: Architecture Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  architecture-gate:
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
    uses: flair-agency/architecture-gatekeeper/.github/workflows/architecture-gate-consumer.yml@bf5b7840077e85493f6af13264c710caa3558b7b
    with:
      protected-review-instructions: true
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
