name: Architecture Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  architecture-gate:
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
    uses: flair-agency/architecture-gatekeeper/.github/workflows/architecture-gate.yml@4c741787d3d353f65eec9344179218b6a42ff957
    with:
      protected-review-instructions: true
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
