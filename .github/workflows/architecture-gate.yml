name: Architecture Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  architecture-gate:
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
    uses: flair-agency/architecture-gatekeeper/.github/workflows/architecture-gate.yml@50d3e27fc31d48a821c193056a36cec1402ce58c
    with:
      protected-review-instructions: true
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
