name: Architecture Gate (preview.4 fixture)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  architecture-gate:
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
    uses: flair-agency/architecture-gatekeeper/.github/workflows/architecture-gate-consumer.yml@bb7c6078766e2d63cbcaf91e8eab72a7bd46a83f
    with:
      policy-path: .codex/gatekeeper/ci-policy.json
      prompt-path: .codex/gatekeeper/preview-prompt.md
      schema-path: .codex/gatekeeper/preview-host-decision.schema.json
      validation-path: .codex/gatekeeper/preview-rules.json
      protected-review-instructions: true
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
